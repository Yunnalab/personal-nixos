# Shell
shell fish

# Colors — Catppuccin Mocha
background #1e1e2e
foreground #cdd6f4
cursor #f5e0dc
cursor_text_color #1e1e2e
selection_background #585b70
selection_foreground #cdd6f4

# 16-color palette
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

background_opacity 0.48
background_blur 64
dynamic_background_opacity yes

# Font
font_family JetBrainsMono Nerd Font
font_size 12.0

# Scrollback
scrollback_lines 10000

# Mouse
copy_on_select clipboard
mouse_hide_wait 3.0

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Window
window_padding_width 4
hide_window_decorations no
confirm_os_window_close 2

# Keyboard shortcuts
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd

# ── Noctalia 主题 ──
# 配色由 Noctalia 写入 ~/.config/kitty/themes/noctalia.conf，本文件不要放颜色。
# kitty 的 include 路径相对本文件所在目录（~/.config/kitty/）解析。
#
# 注：Noctalia 的 kitty 模板（apply.sh）还会试图 `touch` 本文件来加这行 include，
# 而本文件是 store 里的只读文件，所以那个 hook 必定报一次“权限不够”并退出。
# 它其余的工作（写 themes/noctalia.conf）由 Noctalia 本体完成，不受影响；
# include 写在这里就不需要那个 hook 了。
# 另外实测过：include 的文件不存在时 kitty 只警告不报错，所以无需占位文件。
include themes/noctalia.conf
